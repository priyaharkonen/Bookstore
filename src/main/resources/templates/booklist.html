<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Book List</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
    <h1>Books</h1>

    <!-- Greet auhthenticated username -->
    <div>
        <h3>Welcome <span sec:authentication="name"></span></h3>
    </div>

    <!-- Logout functionality for booklist page -->
    <div>
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Sign out" class="btn btn-danger">

        </form>
    </div>
    <!-- Table -->
    <table class="table table-striped" >
        <tr>
            <th>Author</th>
            <th>Title</th>
            <th>ISBN</th>
            <th>Year</th>
            <th>Price</th>
            <th>Category</th>
            <th sec:authorize="hasAuthority('ADMIN')"></th>
        <!-- Price -muuttujaa ei ole tehtävänannon esimerkissä, mutta lisäsin sen tähän omaani. -->
        </tr>

        <tr th:each = "book : ${books}" >
            <td th:text="${book.author}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.price} + ' €'"></td>
            <td th:text="${book.category.name}"></td>
            <td sec:authorize="hasAuthority('ADMIN')">
                <a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a>
            </td>
            <td><a th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
        </tr>
    </table>
    <a class="btn btn-success" href="/add">Add Book</a>
</body>
</html>
