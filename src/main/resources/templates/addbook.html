<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book List</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <h1>Add Book</h1>
    <div>
        <!-- Form -->

        <form th:object="${book}" th:action="@{save}" action="#" method="post">
            <label for="author">Author</label>
            <input type="text" th:field="*{author}" />
            <div style="clear: both; display: block; height: 10px;"></div>
            <label for="title">Title</label>
            <input type="text" th:field="*{title}" />
            <div style="clear: both; display: block; height: 10px;"></div>
            <label for="isbn">ISBN</label>
            <input type="text" th:field="*{isbn}" />
            <div style="clear: both; display: block; height: 10px;"></div>
            <label for="year">Year</label>
            <input type="number" th:field="*{publicationYear}" />
            <div style="clear: both; display: block; height: 10px;"></div>
            <label for="price">Price</label>
            <input type="number" step="any" th:field="*{price}" />

            <!-- Dropdown list of categories -->
            <div style="clear: both; display: block; height: 10px;"></div>
            <label for="ctgrylist">Category</label>

            <select id="ctgrylist" th:field="*{category}" class="form-control"> 
                <option 
                    th:each="category: ${categories}" 
                    th:value="${category.categoryId}"
                    th:text="${category.name}">
                </option>
            </select>

            <!-- Submission btn -->
            <div style="clear: both; display: block; height: 10px;"></div>
            <input type="submit" value="Save"></input>
        </form>
    </div>
   
</body>
</html>
